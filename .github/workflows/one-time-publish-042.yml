name: Publish requested Recipe Hunter 0.4.2 once
on:
  push:
    branches: [ 'release/publish-042-20261027' ]
jobs:
  publish:
    if: "github.event.head_commit.message == 'Publish requested tested Recipe Hunter 0.4.2'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact successful test run and download its artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh api repos/$GH_REPO/actions/runs/40525136250 --jq .conclusion)" = success
          test "$(gh api repos/$GH_REPO/actions/runs/40525136250 --jq .head_sha)" = 6c1c8bc537ab8fcbd4e87420eba35c3ea7f8ef44
          gh run download 40525136250 --name recipe-hunter-0.4.2-mc26.1.2 --dir verified
          cd verified
          sed 's#build/##' libs/SHA256SUMS.txt | sha256sum --check -
          cp libs/recipe-hunter-0.4.2.jar ../recipe-hunter-0.4.2+26.1.2.jar
      - name: Publish requested release without replacing any old tag or asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum recipe-hunter-0.4.2+26.1.2.jar > SHA256SUMS.txt
          gh release create v0.4.2 recipe-hunter-0.4.2+26.1.2.jar SHA256SUMS.txt --target 6c1c8bc537ab8fcbd4e87420eba35c3ea7f8ef44 --title 'Recipe Hunter 0.4.2 · Minecraft 26.1.2' --notes-file RELEASE_NOTES.md --latest
          gh release view v0.4.2 --json tagName,name,assets,url
