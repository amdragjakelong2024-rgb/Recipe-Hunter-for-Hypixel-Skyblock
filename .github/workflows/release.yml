name: Release Recipe Hunter 0.4.4

on:
  push:
    branches:
      - release/0.4.4

permissions:
  contents: write

concurrency:
  group: recipe-hunter-v044-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.head_commit.message == 'Release Recipe Hunter v0.4.4'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Gradle 9.7.0
        run: |
          curl -L https://services.gradle.org/distributions/gradle-9.7.0-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Check SkyBlock catalogue scope
        run: python3 scripts/check_catalog_scope.py
      - name: Build and run regression tests
        run: /tmp/gradle-9.7.0/bin/gradle clean build plannerTest
      - name: Native Minecraft UI smoke test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          timeout 300s xvfb-run -a /tmp/gradle-9.7.0/bin/gradle runClient -PuiSmoke --args='--width 1280 --height 800'
          test -f run/ui-smoke/PASS.txt
          test -f run/ui-smoke/TEST2-PASS.txt
          test ! -f run/ui-smoke/FAIL.txt
      - name: Prepare release JAR and checksum
        run: |
          test -f build/libs/recipe-hunter-0.4.4.jar
          mkdir -p build/release
          cp build/libs/recipe-hunter-0.4.4.jar build/release/recipe-hunter-0.4.4+26.1.2.jar
          cd build/release
          sha256sum recipe-hunter-0.4.4+26.1.2.jar > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.4
          target_commitish: ${{ github.sha }}
          name: Recipe Hunter 0.4.4 · Minecraft 26.1.2
          body_path: RELEASE_NOTES.md
          files: |
            build/release/recipe-hunter-0.4.4+26.1.2.jar
            build/release/SHA256SUMS.txt
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
