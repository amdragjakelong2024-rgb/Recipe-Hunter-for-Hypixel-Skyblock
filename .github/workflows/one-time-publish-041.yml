name: Publish owner-approved Recipe Hunter 0.4.1 (one time)
on:
  push:
    branches: [ 'release/publish-041-20261027' ]

jobs:
  publish-once:
    if: "github.event.head_commit.message == 'Authorize public 0.4.1 release: consolidated tested Recipe Hunter'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact approved source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify authorized code commit
        run: |
          test "$(git merge-base HEAD dbb87ee015dc68e9836ad8b498b0dc59cc22dcb8)" = "dbb87ee015dc68e9836ad8b498b0dc59cc22dcb8"
          test "$(git diff --name-only dbb87ee015dc68e9836ad8b498b0dc59cc22dcb8 HEAD)" = ".github/workflows/one-time-publish-041.yml"
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Gradle 9.7.0
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-9.7.0-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Check SkyBlock catalogue scope
        run: python3 scripts/check_catalog_scope.py
      - name: Build and run regression tests
        run: /tmp/gradle-9.7.0/bin/gradle build plannerTest
      - name: Verify and stage installable mod
        run: |
          test -s build/libs/recipe-hunter-0.4.1.jar
          cp build/libs/recipe-hunter-0.4.1.jar build/libs/recipe-hunter-0.4.1+26.1.2.jar
          sha256sum build/libs/recipe-hunter-0.4.1+26.1.2.jar
      - name: Publish owner-approved 0.4.1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          target="dbb87ee015dc68e9836ad8b498b0dc59cc22dcb8"
          if gh release view 0.4.1 >/dev/null 2>&1; then
            gh release upload 0.4.1 build/libs/recipe-hunter-0.4.1+26.1.2.jar --clobber
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/0.4.1" -f sha="$target" -F force=true
            gh release edit 0.4.1 --title 'recipe-hunter-0.4.1+26.1.2' --notes-file RELEASE_NOTES.md --latest
          else
            gh release create 0.4.1 build/libs/recipe-hunter-0.4.1+26.1.2.jar --target "$target" --title 'recipe-hunter-0.4.1+26.1.2' --notes-file RELEASE_NOTES.md --latest
          fi
          gh release view 0.4.1 --json tagName,name,assets,url
