name: Build Recipe Hunter

on:
  push:
    branches: [ main, 'update/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Gradle 9.7.0
        run: |
          curl -L https://services.gradle.org/distributions/gradle-9.7.0-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build and test
        run: /tmp/gradle-9.7.0/bin/gradle build plannerTest
      - name: Checksum artifacts
        run: sha256sum build/libs/*.jar > build/libs/SHA256SUMS.txt
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: recipe-hunter-0.4.1-mc26.1.2
          path: build/libs/
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp build/libs/recipe-hunter-0.4.1.jar build/libs/recipe-hunter-0.4.1+26.1.2.jar
          if gh release view 0.4.1 >/dev/null 2>&1; then
            echo 'Release 0.4.1 already exists; leaving published assets unchanged.'
          else
            gh release create 0.4.1 build/libs/recipe-hunter-0.4.1+26.1.2.jar --target "$GITHUB_SHA" --title 'recipe-hunter-0.4.1+26.1.2' --notes-file RELEASE_NOTES.md --latest
          fi
