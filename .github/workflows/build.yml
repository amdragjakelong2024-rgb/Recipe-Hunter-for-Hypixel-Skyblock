name: Build Recipe Hunter

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5'
      - name: Build and test
        run: gradle build plannerTest
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: recipe-hunter-0.3.1-mc26.1.2
          path: build/libs/*.jar
          if-no-files-found: error
