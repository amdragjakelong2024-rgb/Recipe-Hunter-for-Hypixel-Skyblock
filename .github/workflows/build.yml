name: Build Recipe Hunter (no automatic release)

on:
  push:
    branches: [ main, 'update/**' ]
  workflow_dispatch:

concurrency:
  group: recipe-hunter-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Gradle 9.7.0
        run: |
          curl -L https://services.gradle.org/distributions/gradle-9.7.0-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Check SkyBlock catalogue scope
        run: python3 scripts/check_catalog_scope.py
      - name: Build and test
        run: /tmp/gradle-9.7.0/bin/gradle build plannerTest
      - name: Native Minecraft UI smoke test
        if: startsWith(github.ref, 'refs/heads/update/')
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          timeout 300s xvfb-run -a /tmp/gradle-9.7.0/bin/gradle runClient -PuiSmoke --args='--width 1280 --height 800'
          test -f run/ui-smoke/PASS.txt
          test -f run/ui-smoke/TEST2-PASS.txt
          test ! -f run/ui-smoke/FAIL.txt
      - name: Upload native UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-smoke
          path: run/ui-smoke/
          if-no-files-found: ignore
      - name: Checksum artifacts
        run: |
          mkdir -p build/test-build
          cp build/libs/recipe-hunter-0.4.3.jar build/test-build/recipe-hunter-0.4.3-TEST-2.jar
          cd build/test-build
          sha256sum recipe-hunter-0.4.3-TEST-2.jar > SHA256SUMS.txt
      # QA artifacts only. Never push to public Releases automatically.
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: recipe-hunter-0.4.3-TEST-2
          path: |
            build/test-build/
            build/reports/catalogue-progress.txt
          if-no-files-found: error
