name: Build Recipe Hunter

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Gradle 9.5
        run: |
          curl -L https://services.gradle.org/distributions/gradle-9.5-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build and test
        run: /tmp/gradle-9.5/bin/gradle build plannerTest
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: recipe-hunter-0.3.1-mc26.1.2
          path: build/libs/*.jar
          if-no-files-found: error
