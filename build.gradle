plugins { id 'net.fabricmc.fabric-loom' version '1.18.2' }
version = '0.3.0'
group = 'dev.recipehunter'
base { archivesName = 'recipe-hunter' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:26.1.2'
 implementation 'net.fabricmc:fabric-loader:0.19.3'
 implementation 'net.fabricmc.fabric-api:fabric-api:0.155.3+26.1.2'
}
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
tasks.register('plannerTest', JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'dev.recipehunter.PlannerTest'
 args 'src/main/resources/assets/recipehunter/catalog.json'
}

tasks.processResources { from(projectDir) { include "LICENSE", "NEU-DATA-LICENSE.txt" } }
